[package]
name = "herald"
version = "0.3.0"
license = "MIT"
edition = "2021"

[dependencies]
softbuffer = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22.1"
sha2 = "0.10"
ureq = "2.12.1"
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
image = { version = "0.25", default-features = false, features = ["png"] }
fontdue = "0.9"
chrono = "0.4"
rand = "0.8.8"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
gpui-kit = "=0.7.1"

[target.'cfg(target_os = "windows")'.dependencies]
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_Media_MediaFoundation"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
tao = "=0.37.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
atspi = { version = "0.29", default-features = false, features = ["connection", "proxies", "tokio"] }
tokio = { version = "1", features = ["rt", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow"] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
debug = 0

[profile.release]
debug = 0
codegen-units = 1
strip = true
panic = "abort"
